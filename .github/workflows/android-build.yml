name: Build Rekapan Retribusi UPT Trans
on:
  workflow_dispatch:
  push:
    branches: [ "main", "versi-2-pembangunan" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted Ubuntu runners already include Android SDK.
      # Avoid setup-android installing the obsolete "tools" package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rekapan-Retribusi-UPT-Trans-debug
          path: app/build/outputs/apk/debug/app-debug.apk
